name: TraceView CI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: "18"

      - name: Install and Build 🔧
        run: |
          npm install
          npm run build
